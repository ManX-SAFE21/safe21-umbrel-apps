<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="420" rx="16" fill="#0f172a"/>
  <text x="440" y="42" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">Cosa serve</text>

  <!-- Raspberry Pi -->
  <rect x="330" y="150" width="220" height="130" rx="12" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="200" fill="#f0fdf4" font-size="20" font-weight="700" text-anchor="middle">Raspberry Pi 5</text>
  <text x="440" y="226" fill="#bbf7d0" font-size="15" text-anchor="middle">8 GB di RAM</text>
  <text x="440" y="250" fill="#bbf7d0" font-size="15" text-anchor="middle">+ dissipatore / ventola</text>

  <!-- microSD -->
  <rect x="60" y="90" width="200" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="160" y="124" fill="#e0f2fe" font-size="16" font-weight="700" text-anchor="middle">microSD 32 GB+</text>
  <text x="160" y="148" fill="#bae6fd" font-size="13" text-anchor="middle">sistema umbrelOS</text>
  <line x1="260" y1="130" x2="330" y2="180" stroke="#38bdf8" stroke-width="2"/>

  <!-- SSD -->
  <rect x="60" y="250" width="200" height="90" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="284" fill="#fef3c7" font-size="16" font-weight="700" text-anchor="middle">SSD 2 TB</text>
  <text x="160" y="306" fill="#fde68a" font-size="13" text-anchor="middle">USB 3 o NVMe</text>
  <text x="160" y="326" fill="#fde68a" font-size="13" text-anchor="middle">blockchain (~1 TB e cresce)</text>
  <line x1="260" y1="295" x2="330" y2="250" stroke="#f59e0b" stroke-width="2"/>

  <!-- Power -->
  <rect x="620" y="90" width="200" height="80" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <text x="720" y="124" fill="#ffe4e6" font-size="16" font-weight="700" text-anchor="middle">Alimentatore</text>
  <text x="720" y="148" fill="#fecdd3" font-size="13" text-anchor="middle">ufficiale 27 W (USB-C)</text>
  <line x1="620" y1="130" x2="550" y2="180" stroke="#f43f5e" stroke-width="2"/>

  <!-- Router -->
  <rect x="620" y="250" width="200" height="90" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="720" y="284" fill="#ede9fe" font-size="16" font-weight="700" text-anchor="middle">Router di casa</text>
  <text x="720" y="306" fill="#ddd6fe" font-size="13" text-anchor="middle">cavo Ethernet</text>
  <text x="720" y="326" fill="#ddd6fe" font-size="13" text-anchor="middle">(non Wi-Fi)</text>
  <line x1="620" y1="295" x2="550" y2="250" stroke="#a78bfa" stroke-width="2"/>

  <text x="440" y="390" fill="#94a3b8" font-size="14" text-anchor="middle">In alternativa alla microSD, umbrelOS si può installare direttamente sull'SSD NVMe (consigliato su Pi 5).</text>
</svg>
