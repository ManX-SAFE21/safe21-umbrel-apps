version: "0.6.0"
tagline: Assistenza SAFE21, con i messaggi solo sul tuo Umbrel
description: >-
  Sportello di assistenza per i clienti di SAFE21. I clienti aprono un ticket
  dalla pagina pubblica (raggiungibile con un tunnel Cloudflare) e lo seguono
  da un link privato. Il testo dei messaggi resta solo su questo Umbrel: per
  email partono soltanto avvisi con il link, mai il contenuto. L'icona
  dell'app apre il pannello per rispondere, protetto dal login di Umbrel.
