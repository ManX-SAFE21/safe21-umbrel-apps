releaseNotes: "0.6.0: pannello raggiungibile anche da fuori casa, su un indirizzo protetto da Cloudflare Access (codice via email) piu la password del pannello; l'app controlla la firma di Cloudflare su ogni richiesta. Finche non lo attivi nelle Impostazioni (dall'icona di Umbrel) da fuori resta chiuso. Per passare a una nuova versione usa sempre Aggiorna: disinstallare l'app cancella tutti i ticket."
